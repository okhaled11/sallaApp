[functions]
  directory = "server/functions"

# Must come before the generic /api/* rule
[[redirects]]
  from = "/api/webhooks/salla"
  to = "/.netlify/functions/salla-webhook"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

[dev]
  command = "pnpm dev"
  port = 8808
  publish = "."
